<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="85%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60d5ff"/>
      <stop offset="45%" stop-color="#0099ff"/>
      <stop offset="80%" stop-color="#0055d4"/>
      <stop offset="100%" stop-color="#001f5c"/>
    </radialGradient>
    <linearGradient id="eyeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60d5ff"/>
      <stop offset="50%" stop-color="#00a3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base with Neon Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="29.5" stroke="url(#eyeStroke)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Surveillance Grid Details -->
  <circle cx="32" cy="32" r="25" stroke="#0099ff" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- Outer Cyber Eye Contour -->
  <path d="M8 32 C16 17, 48 17, 56 32 C48 47, 16 47, 8 32 Z" fill="#0b101d" stroke="url(#eyeStroke)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Iris -->
  <circle cx="32" cy="32" r="11" fill="url(#irisGlow)"/>
  <circle cx="32" cy="32" r="11" stroke="#80e5ff" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Inner Pupil -->
  <circle cx="32" cy="32" r="5" fill="#02050e"/>
  <circle cx="32" cy="32" r="2.5" fill="#00f2ff"/>

  <!-- Catchlight / Tech Reflection -->
  <circle cx="35" cy="29" r="1.8" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="29" cy="35" r="0.8" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Horizontal Tech Reticle Marks -->
  <line x1="3" y1="32" x2="9" y2="32" stroke="#00f2ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="32" x2="61" y2="32" stroke="#00f2ff" stroke-width="1.5" stroke-linecap="round"/>
</svg>